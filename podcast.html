<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eDC Launchpad - Podcast Detail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Navigation Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <main class="main-content animate-fade-in" id="podcast-content-container">
      <!-- Loader placeholder -->
      <div style="padding: 3rem 0; text-align: center; color: var(--color-on-surface-variant);">
        Loading podcast details...
      </div>
    </main>

    <!-- Leaderboard Sidebar -->
    <div id="leaderboard-container"></div>
  </div>

  <!-- Shared Javascript -->
  <script src="db.js"></script>
  <script src="xp.js"></script>

  <!-- Page specific script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const podcastId = urlParams.get('id');

      const getCompletedResources = () => {
        const saved = localStorage.getItem("completed_resources");
        return saved ? JSON.parse(saved) : { "lean-startup": true };
      };

      const getBookmarkedResources = () => {
        const saved = localStorage.getItem("bookmarked_resources");
        return saved ? JSON.parse(saved) : {};
      };

      // Extract YouTube Video ID and format embed URL
      const getYouTubeEmbedUrl = (url) => {
        let videoId = '';
        if (url.includes('v=')) {
          videoId = url.split('v=')[1].split('&')[0];
        } else if (url.includes('youtu.be/')) {
          videoId = url.split('youtu.be/')[1].split('?')[0];
        }
        return `https://www.youtube.com/embed/${videoId}`;
      };

      // Load specific podcast
      const podcast = (window.podcastsData || []).find(p => p.id === podcastId);
      const mainContainer = document.getElementById("podcast-content-container");

      if (!podcast) {
        if (mainContainer) {
          mainContainer.innerHTML = `
            <div style="max-width: 44rem; margin: 3rem auto; text-align: center; display: flex; flex-direction: column; gap: 1.5rem; align-items: center;">
              <h2 class="font-headline-lg text-error">Podcast Not Found</h2>
              <p class="font-body-lg text-on-surface-variant">The podcast you are looking for does not exist in our library.</p>
              <a href="explore.html" class="btn btn-primary">Return to Explore</a>
            </div>
          `;
        }
        return;
      }

      // Render podcast details
      const renderPodcastDetails = () => {
        const completed = getCompletedResources();
        const bookmarks = getBookmarkedResources();

        const isDone = completed[podcast.id];
        const isBookmarked = bookmarks[podcast.id];

        // 3 similar podcasts
        const similar = (window.podcastsData || [])
          .filter(p => p.id !== podcast.id)
          .slice(0, 3);

        const embedUrl = getYouTubeEmbedUrl(podcast.youtubeUrl);

        mainContainer.innerHTML = `
          <div class="detail-layout">
            <!-- Back Nav -->
            <a href="explore.html" class="btn btn-secondary btn-icon-sm" style="width: fit-content; border: none; padding-left: 0; display: flex; align-items: center; gap: 0.5rem; color: var(--color-primary);">
              <span class="material-symbols-outlined" style="font-size: 1.25rem;">arrow_back</span>
              Back to Explore
            </a>

            <!-- Header Panel -->
            <div class="glass-panel book-header-panel">
              <!-- Large Cover -->
              <div class="book-cover-large">
                <img src="${podcast.coverUrl}" alt="${podcast.title}">
                ${isDone ? `
                  <div class="card-check" style="top: 0.75rem; right: 0.75rem;">
                    <span class="material-symbols-outlined text-sm font-bold">check</span>
                  </div>
                ` : ''}
                <div class="card-xp-badge" style="bottom: 0.75rem; left: 0.75rem;">+${podcast.xp} XP</div>
              </div>

              <!-- Information column -->
              <div class="book-info-col">
                <div>
                  <span class="type-tag" style="background: rgba(78, 222, 163, 0.1); border-color: rgba(78, 222, 163, 0.2); color: var(--color-secondary);">🎙️ Podcast</span>
                  <h1 class="font-headline-lg" style="margin-top: 0.5rem; line-height: 1.2;">${podcast.title}</h1>
                  <p class="font-body-md" style="margin-top: 0.25rem;">With <span class="text-primary font-label-md">${podcast.host}</span></p>
                </div>

                <div class="meta-stats-row">
                  <div class="meta-stat">
                    <span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1">star</span>
                    <strong>${podcast.rating}</strong>
                    <span>(Rating)</span>
                  </div>
                  <div class="meta-stat">
                    <span class="material-symbols-outlined">playlist_play</span>
                    <span>${podcast.episodes}</span>
                  </div>
                </div>

                <!-- Category Tags -->
                <div class="stage-tags-row">
                  ${podcast.tags.map(tag => `<span class="stage-tag" style="border-color: rgba(173, 198, 255, 0.2); color: var(--color-primary);">${tag}</span>`).join('')}
                </div>

                <div class="actions-row">
                  ${isDone ? `
                    <button class="btn btn-completed" style="flex: 1;"><span class="material-symbols-outlined font-bold" style="font-size: 1rem;">check</span>Completed (+${podcast.xp} XP)</button>
                  ` : `
                    <button class="btn btn-primary" style="flex: 1;" onclick="handleMarkCompleted()"><span class="material-symbols-outlined font-bold" style="font-size: 1rem;">check</span>Mark as Done</button>
                  `}

                  <button class="btn btn-secondary ${isBookmarked ? 'btn-bookmark-active' : ''}" style="display: flex; gap: 0.5rem;" onclick="handleToggleBookmark()">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' ${isBookmarked ? 1 : 0}; font-size: 1.125rem;">bookmark</span>
                    <span>${isBookmarked ? 'Bookmarked' : 'Bookmark'}</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- YouTube Video Player Section -->
            <div class="glass-panel info-panel">
              <div class="pdf-viewer-header">
                <h2 style="border: none; padding-bottom: 0; margin-bottom: 0; display: flex; align-items: center; gap: 0.5rem;">
                  <span class="material-symbols-outlined text-secondary" style="font-size: 1.5rem;">play_circle</span>
                  🎥 Watch Podcast Episode
                </h2>
                <a href="${podcast.youtubeUrl}" target="_blank" rel="noreferrer" class="btn btn-secondary btn-icon-sm" style="display: flex; align-items: center; gap: 0.25rem;">
                  <span class="material-symbols-outlined" style="font-size: 0.875rem;">open_in_new</span>
                  Open on YouTube
                </a>
              </div>
              
              <!-- Video Iframe -->
              <div class="pdf-iframe-container" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem;">
                <iframe 
                  src="${embedUrl}" 
                  title="${podcast.title}" 
                  style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                  allowfullscreen>
                </iframe>
              </div>
            </div>

            <!-- Summary Section -->
            <div class="glass-panel info-panel">
              <h2>📝 Video Summary & Insights</h2>
              <p class="about-text" style="font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem;">${podcast.summary}</p>
              
              ${podcast.highlights && podcast.highlights.length > 0 ? `
                <div style="margin-top: 1.5rem; border-top: 1px solid var(--color-outline-variant); padding-top: 1.5rem;">
                  <h3 class="font-label-md" style="margin-bottom: 0.75rem; color: var(--color-primary); display: flex; align-items: center; gap: 0.375rem;">
                    <span class="material-symbols-outlined" style="font-size: 1.125rem;">auto_awesome</span> Key Highlights
                  </h3>
                  <div class="bullets-grid" style="grid-template-columns: 1fr; gap: 0.875rem;">
                    ${podcast.highlights.map(h => `
                      <div class="bullet-li">
                        <span class="bullet-dot text-primary">•</span>
                        <span class="font-body-md">${h}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              ${podcast.keyInsights && podcast.keyInsights.length > 0 ? `
                <div style="margin-top: 2rem; border-top: 1px solid var(--color-outline-variant); padding-top: 1.5rem;">
                  <h3 class="font-label-md" style="margin-bottom: 0.75rem; color: var(--color-secondary); display: flex; align-items: center; gap: 0.375rem;">
                    <span class="material-symbols-outlined" style="font-size: 1.125rem;">lightbulb</span> Core Insights
                  </h3>
                  <div class="bullets-grid" style="grid-template-columns: 1fr; gap: 1rem;">
                    ${podcast.keyInsights.map(ki => {
                      const split = ki.split(':');
                      const title = split[0];
                      const desc = split.slice(1).join(':');
                      return `
                        <div class="bullet-li" style="align-items: flex-start;">
                          <span class="bullet-dot text-secondary" style="margin-top: 0.125rem;">•</span>
                          <span class="font-body-md"><strong class="text-secondary">${title}:</strong>${desc}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Similar Podcasts Section -->
            <div style="display: flex; flex-direction: column; gap: 1rem;">
              <h2 class="font-headline-md">🎙️ Similar Podcasts</h2>
              <div class="grid-similar">
                ${similar.map(sim => {
                  const isSimDone = completed[sim.id];
                  return `
                    <div class="glass-card similar-card" onclick="window.location.href='podcast.html?id=${sim.id}'; window.scrollTo({top: 0, behavior: 'smooth'});">
                      <div class="similar-cover" style="border-radius: 50%; width: 4.5rem; height: 4.5rem; overflow: hidden; border: 2px solid var(--color-outline-variant);">
                        <img src="${sim.coverUrl}" alt="${sim.title}">
                        ${isSimDone ? `
                          <div class="card-check" style="width: 1.25rem; height: 1.25rem; top: 0.25rem; right: 0.25rem;">
                            <span class="material-symbols-outlined text-[10px] font-bold">check</span>
                          </div>
                        ` : ''}
                      </div>
                      <div class="similar-info">
                        <div>
                          <h4 style="font-size: 0.875rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${sim.title}</h4>
                          <p class="font-body-sm" style="font-size: 0.6875rem;">${sim.host}</p>
                        </div>
                        <div class="similar-footer">
                          <span>+${sim.xp} XP</span>
                          <span style="color: var(--color-primary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.625rem;">Rating: ${sim.rating}</span>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

          </div>
        `;
      };

      // Handler functions
      window.handleMarkCompleted = () => {
        const completed = getCompletedResources();
        completed[podcast.id] = true;
        localStorage.setItem("completed_resources", JSON.stringify(completed));
        window.dispatchEvent(new Event("xp-updated"));
        if (window.updateXPUI) window.updateXPUI();
        renderPodcastDetails();
      };

      window.handleToggleBookmark = () => {
        const bookmarks = getBookmarkedResources();
        bookmarks[podcast.id] = !bookmarks[podcast.id];
        localStorage.setItem("bookmarked_resources", JSON.stringify(bookmarks));
        window.dispatchEvent(new Event("xp-updated"));
        if (window.updateXPUI) window.updateXPUI();
        renderPodcastDetails();
      };

      // Initial Render
      renderPodcastDetails();
    });
  </script>
</body>
</html>
